schema: spec-driven

context: |
  Lumina is a partially functional Next.js 16 App Router application for AI-assisted scientific document review.
  The current frontend is TypeScript, React 19, Tailwind CSS 4, next-themes, axios, motion, lucide-react, radash, and zod.
  The application language is Brazilian Portuguese.
  The UI is organized around a fixed application shell with header, collapsible sidebar, theme toggle, and feature pages.
  The frontend talks to an external backend through the internal `/api/backend/*` proxy route, which depends on `API_BASE_URL`.
  Current backend integration uses email-and-password authentication, with the authenticated backend session carried by HttpOnly cookies on requests through the internal proxy.
  Document project state is restored from backend data; backend document and release ids are the canonical identifiers for uploaded PDFs and analysis data.
  OpenSpec was initialized after the application already had partial functionality; the current specs document the baseline as of 2026-07-29 rather than a new implementation plan.
